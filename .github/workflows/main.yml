name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Install deps
        run: npm install

      - name: Install packages
        run: npm run install-packages

      # - name: Lint
      #   run: npm run lint

      - name: Build web and mobile distributions
        run: npm run build:all

      - name: Test
        run: npm test -- --ci

      - name: React Native runtime budgets
        run: npm run benchmark:runtime --workspace=hyperion-react-native

      - name: React Native Metro bundle budget
        run: npm run benchmark:bundle:ios --workspace=hyperion-react-native-testapp
